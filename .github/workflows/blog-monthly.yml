name: blog-monthly

# Monthly optimization (CTR title tests, striking-distance FAQs, freshness, prune) then the report.
on:
  schedule:
    - cron: '0 16 1 * *'
  workflow_dispatch:

concurrency:
  group: blog-engine
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Claude Code (signs in with your Claude account, no API key)
        run: npm install -g @anthropic-ai/claude-code
      - name: Optimize
        run: npm run engine:refresh
      - name: Build check (edits must not break the site)
        run: npm run build && npm run validate
      - name: Report
        run: npm run engine:report
      # One commit for everything the run touched, rebased with --autostash and retried (see blog-engine/scripts/ci-push.sh).
      - name: Commit and push
        run: bash blog-engine/scripts/ci-push.sh "blog-engine: monthly optimization and report"
      - name: Alert - the job crashed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run engine:report-run -- --crash
